<div class="d-flex align-items-center justify-content-center pb-4">
  <div class="border border-primary-bright col me-3"></div>
  <div class="text-center fs-4 fw-700" [id]="categories.alias" [innerHTML]="categories.nome"></div>
  <div class="border border-primary-bright col ms-3"></div>
</div>
<!-- <div [innerHTML]="menuitems"></div> -->
<ng-container *ngIf="filterProduct">
  <div class="row row-cols-md-2 row-cols-xxl-3">
    <ng-container *ngFor="let product of filterProduct; let isLast = last">
      <ng-container *ngIf="finished">
        <!-- Lista Mobile -->
        <div class="d-md-none">
          <div [ngClass]="isLast ? 'py-2' : 'border-bottom border-main-bright border-1 py-2'">
            <products-card [product]=product></products-card>
          </div>
        </div>
        <!-- Lista PC -->
        <div class="d-none d-md-block">
          <div>
            <products-card [product]=product></products-card>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</ng-container>
